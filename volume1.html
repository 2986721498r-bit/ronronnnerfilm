<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume 1 — Film</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0e0e0e; color: #e0e0e0; font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; }
.nav { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 0; }
.back { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: #444; text-decoration: none; transition: color 0.15s; }
.back:hover { color: #bbb; }
header {
  max-width: 900px; margin: 0 auto;
  padding: 2rem 2rem 1.8rem;
  border-bottom: 0.5px solid #1e1e1e;
  display: flex; justify-content: space-between; align-items: flex-end;
}
h1 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 300; letter-spacing: 0.06em; color: #fff; }
.header-meta { font-size: 0.7rem; color: #444; letter-spacing: 0.08em; line-height: 2; text-align: right; }
main { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 6rem; }
.gallery { columns: 3; column-gap: 6px; }
@media (max-width: 680px) { .gallery { columns: 2; } }
@media (max-width: 380px) { .gallery { columns: 1; } }
.photo-item { break-inside: avoid; margin-bottom: 6px; position: relative; cursor: pointer; overflow: hidden; background: #111; display: none; }
.photo-item.loaded { display: block; }
.photo-item img { display: block; width: 100%; height: auto; filter: contrast(1.04) brightness(0.95) saturate(0.85); transition: filter 0.3s; }
.photo-item:hover img { filter: contrast(1.06) brightness(1.0) saturate(0.9); }
footer { max-width: 900px; margin: 0 auto; padding: 1.5rem 2rem; border-top: 0.5px solid #1e1e1e; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: #333; display: flex; justify-content: space-between; }
#lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 9999; align-items: center; justify-content: center; cursor: zoom-out; }
#lb.open { display: flex; }
#lb img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
#lb-close { position: fixed; top: 1.2rem; right: 1.5rem; color: #444; font-size: 1.2rem; cursor: pointer; transition: color 0.15s; font-family: 'Cormorant Garamond', serif; }
#lb-close:hover { color: #ccc; }
#lb-num { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: #333; letter-spacing: 0.1em; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.photo-item.loaded { animation: fadeUp 0.4s ease both; }
@media (max-width: 500px) { header { flex-direction: column; align-items: flex-start; gap: .5rem; } }
</style>
</head>
<body>
<div class="nav"><a href="index.html" class="back">← 返回</a></div>
<header>
  <h1>Volume 1</h1>
  <div class="header-meta">
    <div id="photo-count">— 张</div>
    <div>2025</div>
  </div>
</header>
<main>
  <div class="gallery" id="gallery">
    <div class="photo-item"><img src="volume1/1.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/2.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/3.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/4.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/5.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/6.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/7.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/8.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/9.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/10.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/11.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/12.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/13.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/14.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/15.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/16.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/17.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/18.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/19.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/20.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/21.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/22.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/23.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/24.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/25.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/26.jpg" alt=""></div>
    <div class="photo-item"><img src="volume1/27.jpg" alt=""></div>

  </div>
</main>
<footer>
  <span>Film · Volume 1</span><span>Analog · Scanned</span>
</footer>

<div id="lb">
  <span id="lb-close" onclick="closeLb()">✕</span>
  <img id="lb-img" src="" alt="">
  <span id="lb-num"></span>
</div>

<script>
// 自动检测图片是否存在，只显示加载成功的
const items = document.querySelectorAll('.photo-item');
let loadedCount = 0;
let loadedItems = [];

items.forEach((item, idx) => {
  const img = item.querySelector('img');
  img.onload = function() {
    item.classList.add('loaded');
    loadedCount++;
    loadedItems.push(item);
    document.getElementById('photo-count').textContent = loadedCount + ' 张';
    item.onclick = () => openLb(img.src, loadedItems.indexOf(item) + 1);
  };
  img.onerror = function() {
    item.remove();
  };
});

function openLb(src, n) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-num').textContent = n + ' / ' + loadedCount;
  document.getElementById('lb').classList.add('open');
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.getElementById('lb').addEventListener('click', e => { if (e.target === document.getElementById('lb')) closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
</script>
</body>
</html>
