<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume 1 — Film-R</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0e0e0e; color: #e0e0e0; font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; }
.nav { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 0; }
.back { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: #555; text-decoration: none; }
.back:hover { color: #bbb; }
header { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 1.8rem; border-bottom: 0.5px solid #1e1e1e; display: flex; justify-content: space-between; align-items: flex-end; }
h1 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 300; letter-spacing: 0.06em; color: #fff; }
.year { font-size: 1rem; color: #888; letter-spacing: 0.12em; }
main { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 6rem; }
.gallery { columns: 3; column-gap: 6px; }
@media (max-width: 680px) { .gallery { columns: 1; } }
.photo-item { break-inside: avoid; margin-bottom: 6px; cursor: pointer; overflow: hidden; }
.photo-item img { display: block; width: 100%; height: auto; filter: contrast(1.04) brightness(0.95) saturate(0.85); }
footer { max-width: 900px; margin: 0 auto; padding: 1.5rem 2rem; border-top: 0.5px solid #1e1e1e; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: #333; display: flex; justify-content: space-between; }
#lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 9999; align-items: center; justify-content: center; cursor: zoom-out; }
#lb.open { display: flex; }
#lb img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
#lb-close { position: fixed; top: 1.2rem; right: 1.5rem; color: #555; font-size: 1.4rem; cursor: pointer; }
#lb-close:hover { color: #ccc; }
#lb-num { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: #444; letter-spacing: 0.1em; }
@media (max-width: 500px) { header { flex-direction: column; align-items: flex-start; gap: .5rem; } .nav, header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; } }
</style>
</head>
<body>
<div class="nav"><a href="index.html" class="back">← 返回</a></div>
<header>
  <h1>Volume 1</h1>
  <div class="year">2025</div>
</header>
<main>
  <div class="gallery">
    <div class="photo-item"><img src="volume1/1.jpg" alt="" loading="lazy"></div>
    <div class="photo-item"><img src="volume1/2.jpg" alt="" loading="lazy"></div>
    <div class="photo-item"><img src="volume1/3.jpg" alt="" loading="lazy"></div>
    <div class="photo-item"><img src="volume1/4.jpg" alt="" loading="lazy"></div>
    <div class="photo-item"><img src="volume1/5.jpg" alt="" loading="lazy"></div>
    <div class="photo-item"><img src="volume1/6.jpg" alt="" loading="lazy"></div>
    <div class="photo-item"><img src="volume1/7.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/8.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/9.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/10.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/11.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/12.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/13.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/14.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/15.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/16.jpg" alt="" loading="lazy"></div>
     <div class="photo-item"><img src="volume1/17.jpg" alt="" loading="lazy"></div>
    新增照片：往下复制一行，改数字
    <div class="photo-item"><img src="volume1/7.jpg" alt="" loading="lazy"></div>
    -->
  </div>
</main>
<footer>
  <span>Film-R · Volume 1</span><span>Analog · Scanned</span>
</footer>
<div id="lb">
  <span id="lb-close" onclick="closeLb()">✕</span>
  <img id="lb-img" src="" alt="">
  <span id="lb-num"></span>
</div>
<script>
var all = document.querySelectorAll('.photo-item img');
var total = all.length;
all.forEach(function(img, i) {
  img.parentNode.addEventListener('click', function() {
    document.getElementById('lb-img').src = img.src;
    document.getElementById('lb-num').textContent = (i+1) + ' / ' + total;
    document.getElementById('lb').classList.add('open');
  });
});
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.getElementById('lb').addEventListener('click', function(e) { if(e.target===this) closeLb(); });
document.addEventListener('keydown', function(e) { if(e.key==='Escape') closeLb(); });
</script>
</body>
</html>
