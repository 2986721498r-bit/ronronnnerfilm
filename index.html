<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film-R</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0e0e0e;
  color: #e0e0e0;
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
}
header {
  max-width: 760px;
  margin: 0 auto;
  padding: 5rem 2rem 3rem;
  border-bottom: 0.5px solid #2a2a2a;
}
h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 300;
  letter-spacing: 0.08em;
  color: #fff;
}
.tagline {
  margin-top: 0.6rem;
  font-size: 0.9rem;
  font-style: italic;
  color: #777;
  letter-spacing: 0.05em;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 2rem 6rem;
}
.list-header {
  display: grid;
  grid-template-columns: 1fr 80px 24px;
  padding: 1.8rem 0 0.7rem;
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #777;
  border-bottom: 0.5px solid #2a2a2a;
}
.album-list { list-style: none; }
.album-item {
  border-bottom: 0.5px solid #1e1e1e;
  transition: background 0.15s;
}
.album-item:hover { background: #141414; }
.album-link {
  display: grid;
  grid-template-columns: 1fr 80px 24px;
  align-items: center;
  padding: 1.2rem 0;
  text-decoration: none;
  color: inherit;
}
.album-name {
  font-size: 1.15rem;
  font-weight: 300;
  color: #ddd;
  letter-spacing: 0.04em;
}
.album-date { font-size: 0.82rem; color: #888; letter-spacing: 0.06em; }
.album-arrow {
  font-size: 0.8rem;
  color: #333;
  text-align: right;
  transition: color 0.15s, transform 0.15s;
}
.album-item:hover .album-arrow { color: #aaa; transform: translateX(3px); }
footer {
  max-width: 760px;
  margin: 0 auto;
  padding: 1.5rem 2rem;
  border-top: 0.5px solid #1e1e1e;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #333;
  display: flex;
  justify-content: space-between;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.album-item { animation: fadeUp 0.4s ease both; }
.album-item:nth-child(1) { animation-delay: 0.05s; }
.album-item:nth-child(2) { animation-delay: 0.10s; }
.album-item:nth-child(3) { animation-delay: 0.15s; }
@media (max-width: 500px) {
  header { padding: 3rem 1.5rem 2rem; }
  main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
}
</style>
</head>
<body>
<header>
  <h1>Film-R</h1>
  <p class="tagline">Remember to record it.</p>
</header>
<main>
  <div class="list-header">
    <span>相册</span>
    <span>日期</span>
    <span></span>
  </div>
  <ul class="album-list">

    <li class="album-item">
      <a href="volume1.html" class="album-link">
        <span class="album-name">Volume 1</span>
        <span class="album-date">2025</span>
        <span class="album-arrow">→</span>
      </a>
    </li>

    <li class="album-item">
      <a href="volume2.html" class="album-link">
        <span class="album-name">Volume 2</span>
        <span class="album-date">2026</span>
        <span class="album-arrow">→</span>
      </a>
    </li>

    <!-- 新增相册：复制上面一个 <li>，改 href、名称、日期 -->

  </ul>
</main>
<footer>
  <span>Film-R</span><span>Analog · Scanned</span>
</footer>
</body>
</html>
