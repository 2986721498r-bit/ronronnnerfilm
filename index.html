<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Archive</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f5f0e8;
  --dark: #1a1714;
  --brown: #3d2e1e;
  --muted: #8a7c6e;
  --border: #c9bfaf;
  --hover-bg: #ede8df;
}
body {
  background: var(--cream);
  color: var(--dark);
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03; pointer-events: none; z-index: 1000;
}
.strip { height: 20px; background: var(--dark); position: relative; overflow: hidden; }
.strip-holes { position: absolute; top: 50%; transform: translateY(-50%); left: 0; right: 0; display: flex; gap: 14px; padding: 0 8px; }
.hole { width: 11px; height: 13px; background: var(--cream); border-radius: 2px; flex-shrink: 0; }
header {
  max-width: 860px; margin: 0 auto;
  padding: 5rem 4rem 3.5rem;
  border-bottom: 0.5px solid var(--border);
}
.eyebrow {
  font-family: 'IM Fell English', Georgia, serif;
  font-style: italic; font-size: 0.72rem;
  letter-spacing: 0.28em; color: var(--muted);
  text-transform: uppercase; margin-bottom: 1rem;
}
h1 {
  font-family: 'IM Fell English', Georgia, serif;
  font-size: clamp(2.8rem, 6vw, 5rem);
  font-weight: 400; letter-spacing: 0.04em; line-height: 1;
}
.tagline { margin-top: 0.75rem; font-style: italic; font-size: 1.05rem; color: var(--muted); font-weight: 300; }
main { max-width: 860px; margin: 0 auto; padding: 0 4rem 6rem; }
.list-header {
  display: grid; grid-template-columns: 1fr 90px 90px 36px;
  padding: 1.5rem 0 0.6rem;
  font-size: 0.62rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 0.5px solid var(--border);
}
.album-list { list-style: none; }
.album-item { border-bottom: 0.5px solid var(--border); transition: background 0.2s; }
.album-item:hover { background: var(--hover-bg); margin: 0 -2rem; padding: 0 2rem; }
.album-link {
  display: grid; grid-template-columns: 1fr 90px 90px 36px;
  align-items: center; padding: 1.1rem 0;
  text-decoration: none; color: inherit;
}
.album-name {
  font-family: 'IM Fell English', Georgia, serif;
  font-size: 1.3rem; font-weight: 400; color: var(--dark);
  letter-spacing: 0.02em; display: flex; align-items: baseline; gap: 0.7rem;
}
.album-name-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.85rem; color: var(--muted); font-weight: 300; }
.album-count { font-size: 0.85rem; color: var(--muted); font-style: italic; }
.album-date { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.05em; font-weight: 300; }
.album-arrow { font-size: 0.9rem; color: var(--border); text-align: right; transition: color 0.2s, transform 0.2s; }
.album-item:hover .album-arrow { color: var(--dark); transform: translateX(3px); }
.roll-num { font-family: 'Cormorant Garamond', serif; font-size: 0.55rem; color: var(--border); letter-spacing: 0.1em; margin-right: 1rem; opacity: 0.7; }
footer {
  max-width: 860px; margin: 0 auto; padding: 1.5rem 4rem 0;
  border-top: 0.5px solid var(--border);
  display: flex; justify-content: space-between;
  font-size: 0.65rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--muted);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.album-item { animation: fadeUp 0.5s ease both; }
.album-item:nth-child(1) { animation-delay: 0.05s; }
@media (max-width: 600px) {
  header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
  .album-link { grid-template-columns: 1fr 70px 28px; }
  .album-date { display: none; }
  .album-item:hover { margin: 0 -0.5rem; padding: 0 0.5rem; }
}
</style>
</head>
<body>

<div class="strip"><div class="strip-holes" id="holes-top"></div></div>

<header>
  <p class="eyebrow">Film Archive · Analog Photography</p>
  <h1>Film</h1>
  <p class="tagline">银盐留下的时间切片</p>
</header>

<main>
  <div class="list-header">
    <span>相册</span>
    <span>张数</span>
    <span>日期</span>
    <span></span>
  </div>

  <ul class="album-list">

    <li class="album-item">
      <a href="volume1.html" class="album-link">
        <span class="album-name">
          <span class="roll-num">R01</span>
          Volume 1
          <span class="album-name-sub">胶片随拍</span>
        </span>
        <span class="album-count">— 张</span>
        <span class="album-date">2024</span>
        <span class="album-arrow">→</span>
      </a>
    </li>

    <!-- 以后新增相册，复制上面这个 <li> 块，改 href、名称、张数、日期 -->

  </ul>
</main>

<footer>
  <span>Film Archive</span>
  <span>Analog · Scanned</span>
</footer>

<div class="strip" style="margin-top:2rem"><div class="strip-holes" id="holes-bottom"></div></div>

<script>
function makeHoles(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const n = Math.ceil(window.innerWidth / 20);
  el.innerHTML = Array(n).fill('<div class="hole"></div>').join('');
}
makeHoles('holes-top');
makeHoles('holes-bottom');
</script>
</body>
</html>
