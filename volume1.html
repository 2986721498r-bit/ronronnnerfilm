<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume 1 — Film</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f5f0e8; --dark: #1a1714; --brown: #3d2e1e;
  --muted: #8a7c6e; --border: #c9bfaf;
}
body { background: var(--cream); color: var(--dark); font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03; pointer-events: none; z-index: 1000;
}
.strip { height: 20px; background: var(--dark); position: relative; overflow: hidden; }
.strip-holes { position: absolute; top: 50%; transform: translateY(-50%); left: 0; right: 0; display: flex; gap: 14px; padding: 0 8px; }
.hole { width: 11px; height: 13px; background: var(--cream); border-radius: 2px; flex-shrink: 0; }
.nav { max-width: 980px; margin: 0 auto; padding: 1.5rem 3rem 0; }
.back { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.back:hover { color: var(--dark); }
header {
  max-width: 980px; margin: 0 auto; padding: 2.5rem 3rem 2rem;
  border-bottom: 0.5px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-end;
}
.eyebrow { font-family: 'IM Fell English', serif; font-style: italic; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
h1 { font-family: 'IM Fell English', serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 400; letter-spacing: 0.04em; line-height: 1.1; }
.subtitle { font-style: italic; font-size: 1rem; color: var(--muted); font-weight: 300; margin-top: 0.3rem; }
.header-meta { text-align: right; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; line-height: 2; }
main { max-width: 980px; margin: 0 auto; padding: 2.5rem 3rem 6rem; }
.gallery { columns: 3; column-gap: 1rem; }
@media (max-width: 700px) { .gallery { columns: 2; } }
@media (max-width: 420px) { .gallery { columns: 1; } }
.photo-item {
  break-inside: avoid; margin-bottom: 1rem;
  position: relative; cursor: pointer; overflow: hidden; background: var(--dark);
}
.photo-item::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
  opacity: 0; transition: opacity 0.35s; z-index: 2;
}
.photo-item:hover::after { opacity: 1; }
.photo-item img {
  display: block; width: 100%; height: auto;
  filter: sepia(0.2) contrast(1.06) brightness(0.97) saturate(0.82);
  transition: transform 0.5s cubic-bezier(0.22,1,0.36,1), filter 0.4s;
}
.photo-item:hover img { transform: scale(1.03); filter: sepia(0.08) contrast(1.08) brightness(1.0) saturate(0.88); }
.frame-badge { position: absolute; bottom: 7px; right: 9px; font-family: 'Cormorant Garamond', serif; font-size: 0.55rem; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; z-index: 3; }
.caption {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 1.5rem 0.8rem 0.6rem;
  background: linear-gradient(to top, rgba(10,8,6,0.8) 0%, transparent 100%);
  z-index: 3; opacity: 0; transform: translateY(4px); transition: opacity 0.3s, transform 0.3s;
}
.photo-item:hover .caption { opacity: 1; transform: translateY(0); }
.caption-text { font-family: 'IM Fell English', serif; font-style: italic; font-size: 0.8rem; color: rgba(255,245,230,0.9); }
.caption-sub { font-size: 0.6rem; color: rgba(255,245,230,0.45); letter-spacing: 0.1em; margin-top: 0.15rem; text-transform: uppercase; }
#lb { display: none; position: fixed; inset: 0; background: rgba(10,8,6,0.96); z-index: 9999; align-items: center; justify-content: center; cursor: zoom-out; padding: 2rem; }
#lb.open { display: flex; }
#lb img { max-width: 90vw; max-height: 88vh; object-fit: contain; filter: sepia(0.12) contrast(1.05); }
#lb-close { position: fixed; top: 1.2rem; right: 1.5rem; color: rgba(255,255,255,0.35); font-size: 1.4rem; cursor: pointer; font-family: 'Cormorant Garamond', serif; transition: color 0.2s; }
#lb-close:hover { color: rgba(255,255,255,0.85); }
#lb-num { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.8rem; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.photo-item { animation: fadeUp 0.55s ease both; }
.photo-item:nth-child(2) { animation-delay: 0.06s; }
.photo-item:nth-child(3) { animation-delay: 0.12s; }
.photo-item:nth-child(4) { animation-delay: 0.18s; }
.photo-item:nth-child(5) { animation-delay: 0.24s; }
.photo-item:nth-child(6) { animation-delay: 0.30s; }
@media (max-width: 600px) { header { flex-direction: column; align-items: flex-start; gap: 1rem; padding: 2rem 1.5rem 1.5rem; } main, .nav { padding-left: 1.5rem; padding-right: 1.5rem; } }
</style>
</head>
<body>

<div class="strip"><div class="strip-holes" id="holes-top"></div></div>

<div class="nav"><a href="index.html" class="back">← 返回相册列表</a></div>

<header>
  <div class="header-left">
    <p class="eyebrow">Roll 01 · Film Archive</p>
    <h1>Volume 1</h1>
    <p class="subtitle">胶片随拍</p>
  </div>
  <div class="header-meta">
    <!-- 可以改成你实际用的胶卷和相机 -->
    <div>Film</div>
    <div>Analog</div>
  </div>
</header>

<main>
  <div class="gallery" id="gallery">

    <!--
    ════════════════════════════════════════
    添加照片说明：

    把下面每个 <div class="photo-item"> 里的
      <img src="volume1/文件名.jpg" alt="">
    改成你实际的图片路径。

    图片放在仓库的 volume1/ 文件夹里，
    文件名对应上就行。

    caption-text → 照片标题（可以留空）
    caption-sub  → 地点或说明（可以留空）
    ════════════════════════════════════════
    -->

    <div class="photo-item" onclick="openLb(this,1)">
      <img src="volume1/1.jpg" alt="">
      <div class="caption"><p class="caption-text"></p><p class="caption-sub"></p></div>
      <span class="frame-badge">01 ▷</span>
    </div>

    <div class="photo-item" onclick="openLb(this,2)">
      <img src="volume1/2.jpg" alt="">
      <div class="caption"><p class="caption-text"></p><p class="caption-sub"></p></div>
      <span class="frame-badge">02 ▷</span>
    </div>

    <div class="photo-item" onclick="openLb(this,3)">
      <img src="volume1/3.jpg" alt="">
      <div class="caption"><p class="caption-text"></p><p class="caption-sub"></p></div>
      <span class="frame-badge">03 ▷</span>
    </div>

    <div class="photo-item" onclick="openLb(this,4)">
      <img src="volume1/4.jpg" alt="">
      <div class="caption"><p class="caption-text"></p><p class="caption-sub"></p></div>
      <span class="frame-badge">04 ▷</span>
    </div>

    <div class="photo-item" onclick="openLb(this,5)">
      <img src="volume1/5.jpg" alt="">
      <div class="caption"><p class="caption-text"></p><p class="caption-sub"></p></div>
      <span class="frame-badge">05 ▷</span>
    </div>

    <div class="photo-item" onclick="openLb(this,6)">
      <img src="volume1/6.jpg" alt="">
      <div class="caption"><p class="caption-text"></p><p class="caption-sub"></p></div>
      <span class="frame-badge">06 ▷</span>
    </div>

    <!-- 继续复制上面的块添加更多照片，记得把数字和文件名改掉 -->

  </div>
</main>

<div class="strip"><div class="strip-holes" id="holes-bottom"></div></div>

<div id="lb">
  <span id="lb-close" onclick="closeLb()">✕</span>
  <img id="lb-img" src="" alt="">
  <span id="lb-num"></span>
</div>

<script>
function makeHoles(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const n = Math.ceil(window.innerWidth / 20);
  el.innerHTML = Array(n).fill('<div class="hole"></div>').join('');
}
makeHoles('holes-top');
makeHoles('holes-bottom');

const items = document.querySelectorAll('.photo-item');
const total = items.length;

function openLb(frame, num) {
  const img = frame.querySelector('img');
  const lbImg = document.getElementById('lb-img');
  const lbNum = document.getElementById('lb-num');
  if (img) { lbImg.src = img.src; lbImg.style.display = 'block'; }
  else { lbImg.style.display = 'none'; }
  lbNum.textContent = num + ' / ' + total;
  document.getElementById('lb').classList.add('open');
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.getElementById('lb').addEventListener('click', e => { if (e.target === document.getElementById('lb')) closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
</script>
</body>
</html>
